<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Chip-8 Emulator</title>
    <style>
        body {
            background-color: #121212;
            color: #f0f0f0;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 30px;
            gap: 15px;
            min-height: 90vh;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 12px;
        }
        button, select {
            padding: 6px 12px;
            font-size: 14px;
            cursor: pointer;
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
            border-radius: 4px;
        }
        button:hover:not(:disabled), select:hover {
            background: #3a3a3a;
        }
        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .color-group {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #1e1e1e;
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid #333;
            font-size: 13px;
        }
        input[type="color"] {
            width: 26px;
            height: 26px;
            border: none;
            background: none;
            cursor: pointer;
            padding: 0;
        }
        .canvas-wrapper {
            position: relative;
            display: inline-block;
        }
        canvas {
            display: block;
            border: 2px solid #333;
            image-rendering: pixelated;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        body.drag-over canvas {
            border-color: #00f0ff;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.35);
        }
        .drop-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.72);
            color: #00f0ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 0.5px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s;
            border: 2px dashed #00f0ff;
        }
        body.drag-over .drop-overlay {
            opacity: 1;
        }
        .status-bar {
            font-size: 13px;
            color: #888;
        }
    </style>
</head>
<body>
    <h1>Chip-8 Emulator</h1>

    <div class="controls">
        <label for="fileinput">Upload or drop a ROM:</label>
        <input type="file" id="fileinput" autocomplete="off" />
        <button id="reset" disabled>Reset (Backspace)</button>

        <div class="color-group">
            <label for="fgColor">Pixel:</label>
            <input type="color" id="fgColor" value="#ffffff" />
            <label for="bgColor">Bg:</label>
            <input type="color" id="bgColor" value="#000000" />
            <select id="themePreset" title="Color Presets">
                <option value="custom">Custom</option>
                <option value="#ffffff|#000000" selected>Classic B&W</option>
                <option value="#33ff33|#0a1a0a">Green Phosphor</option>
                <option value="#ffb000|#1a1000">Amber CRT</option>
                <option value="#9bbc0f|#0f380f">Game Boy</option>
                <option value="#00f0ff|#0d0221">Cyberpunk</option>
            </select>
        </div>
    </div>

    <div class="canvas-wrapper">
        <canvas id="canvas">If you see this message, then your browser doesn't support HTML5</canvas>
        <div class="drop-overlay">Drop .ch8 ROM file here</div>
    </div>

    <div class="status-bar" id="statusBar"></div>

    <script type="module" src="./index.js"></script>
</body>
</html>
