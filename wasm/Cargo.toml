[package]
name = "wasm"
version = "0.1.0"
edition = "2024"

[dependencies]
chip8_core = { path = "../chip8_core" }
js-sys = "0.3.107"
wasm-bindgen = "0.2.130"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[dependencies.web-sys]
version = "0.3.107"
features = [
    "CanvasRenderingContext2d",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "ImageData",
    "KeyboardEvent",
    "Window"
]

[lib]
crate-type = ["cdylib"]
