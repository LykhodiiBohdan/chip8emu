name: Release desktop

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: ubuntu-latest
            name: linux-x64

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux SDL2 build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libasound2-dev libpulse-dev libdbus-1-dev libudev-dev \
            libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev \
            libxinerama-dev libxss-dev libxtst-dev \
            libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev \
            libdrm-dev libgbm-dev \
            libwayland-dev libxkbcommon-dev

      - name: Ensure NASM on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command nasm -ErrorAction SilentlyContinue)) {
            choco install nasm --no-progress -y
            "$env:ProgramFiles\NASM" | Out-File -FilePath $env:GITHUB_PATH -Append
          }

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.name }}

      - name: Build release binary
        run: cargo build --release --locked --manifest-path desktop/Cargo.toml

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item desktop/target/release/desktop.exe dist/chip8-desktop.exe
          Compress-Archive -Path dist/chip8-desktop.exe `
            -DestinationPath "chip8-desktop-${{ github.ref_name }}-windows-x64.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp desktop/target/release/desktop dist/chip8-desktop
          tar -C dist -czf "chip8-desktop-${{ github.ref_name }}-linux-x64.tar.gz" chip8-desktop

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            chip8-desktop-*-windows-x64.zip
            chip8-desktop-*-linux-x64.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
